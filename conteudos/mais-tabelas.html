<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas Dois</title>
</head>
<body>
    <h1>Mais Tabelas</h1>
    <!--
    caption : Legenda/Titulo da tabela
    thead : Table Header (Cabeçalho da tabela)
    tbody : Table Body (Corpo da tabela)
    tfoot : Table Footer (Rodapé da tabela)    
    -->

    <table border = "1">
        <caption>Listagem de Produtos</caption>
        <thead>
            <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço</th>
        </tr>
        </thead>

        <tbody>
            <tr>
            <td>Notebook</td>
            <td>2</td>
            <td>R$ 6.000,00</td>
        </tr>
        <tr>
            <td>Celular</td>
            <td>1</td>
            <td>R$ 3.000,00</td>
        </tr>
        </tbody>

        <tfoot>
            <tr>
                <td>Total</td>
                <td colspan ="2"> R$ 9.000,00</td>
            </tr>
        </tfoot>

    </table>
</body>
</html>
